name: Next 15 migration codemod

on:
  pull_request:

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update remaining async route params
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/[lang]/page.tsx')
          text = path.read_text()
          old = "export default function Home({ params }: { params: { lang: Lang } }) {\n  const lang = params.lang;"
          new = "export default async function Home({ params }: { params: Promise<{ lang: Lang }> }) {\n  const { lang } = await params;"
          if old not in text:
              raise SystemExit('Expected Home signature not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/[lang]/page.tsx
          git commit -m "Adapt home route params for Next.js 15"
          git push
